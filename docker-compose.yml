services:
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      - PORT=5001
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
    depends_on:
      - mysql
    ports:
      - "5001:5001"

  # Add more services here (e.g., user-service) using the same DB config

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - auth-service

  mysql:
    image: mysql:8.0
    container_name: shared-mysql
    restart: always
    environment:
      MYSQL_DATABASE: doctor_house_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
